<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrome Dinosaur Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
            padding: 10px;
        }
        
        .game-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 800px;
            width: 100%;
        }
        
        .game-header {
            text-align: center;
            margin-bottom: 25px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 8px;
            font-size: 28px;
        }
        
        .instructions {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        #gameCanvas {
            display: block;
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin: 0 auto;
            cursor: pointer;
            width: 100%;
            max-width: 600px;
            height: auto;
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
        }
        
        .score-display, .best-score {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }
        
        .score-display span, .best-score span {
            color: #667eea;
            font-size: 18px;
        }
        
        .game-controls {
            text-align: center;
            margin-top: 20px;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        .game-over-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .game-over-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        
        .game-over-box h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 32px;
        }
        
        .game-over-box p {
            color: #666;
            font-size: 18px;
            margin-bottom: 10px;
        }
        
        .final-score {
            color: #667eea;
            font-size: 28px;
            font-weight: bold;
            margin: 20px 0;
        }
        
        .game-over-box button {
            background: #667eea;
            margin-top: 20px;
        }
        
        .mobile-controls {
            display: none;
            text-align: center;
            margin-top: 15px;
            gap: 10px;
            justify-content: center;
        }
        
        .mobile-controls button {
            flex: 0 1 auto;
            margin: 5px;
            padding: 15px 20px;
            font-size: 14px;
        }
        
        @media (max-width: 600px) {
            .game-container {
                padding: 15px;
            }
            
            h1 {
                font-size: 22px;
            }
            
            .mobile-controls {
                display: flex;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>🦖 Chrome Dinosaur Game</h1>
            <p class="instructions">Press SPACE or click the canvas to jump. Use Arrow Down to duck!</p>
        </div>
        
        <canvas id="gameCanvas" width="600" height="300"></canvas>
        
        <div class="game-info">
            <div class="score-display">Score: <span id="score">0</span></div>
            <div class="best-score">Best: <span id="bestScore">0</span></div>
        </div>
        
        <div class="game-controls">
            <button onclick="toggleGame()">Start/Pause</button>
            <button onclick="resetGame()">New Game</button>
        </div>
        
        <div class="mobile-controls" id="mobileControls">
            <button onclick="jump()">⬆ Jump</button>
            <button onclick="duck()">⬇ Duck</button>
        </div>
    </div>
    
    <div class="game-over-screen" id="gameOverScreen">
        <div class="game-over-box">
            <h2>Game Over!</h2>
            <p>You dodged obstacles for</p>
            <div class="final-score" id="finalScore">0</div>
            <p>meters</p>
            <button onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let actualWidth = 600;
        let actualHeight = 300;
        
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            const scale = window.devicePixelRatio || 1;
            actualWidth = rect.width;
            actualHeight = rect.height;
            canvas.width = actualWidth * scale;
            canvas.height = actualHeight * scale;
            ctx.scale(scale, scale);
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        let gameActive = false;
        let gamePaused = false;
        let gameRunning = false;
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('dino_bestScore')) || 0;
        let speedMultiplier = 1;
        
        const dino = {
            x: 50,
            y: 0,
            width: 40,
            height: 50,
            velocityY: 0,
            jumping: false,
            ducking: false,
            color: '#333'
        };
        
        const gravity = 0.6;
        const jumpPower = -10;
        const groundY = actualHeight - 80;
        dino.y = groundY;
        dino.height = 45;
        
        let obstacles = [];
        
        class Obstacle {
            constructor() {
                this.width = 20 + Math.random() * 20;
                this.height = 40 + Math.random() * 20;
                this.x = actualWidth;
                this.y = groundY - this.height;
                this.speed = 4 + (speedMultiplier * 1.5);
                this.color = '#666';
            }
            
            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.fillStyle = '#444';
                for (let i = 0; i < 3; i++) {
                    ctx.fillRect(this.x - 5, this.y + i * 15, 5, 5);
                    ctx.fillRect(this.x + this.width, this.y + i * 15, 5, 5);
                }
            }
            
            update() {
                this.x -= this.speed;
            }
            
            isOffScreen() {
                return this.x + this.width < 0;
            }
        }
        
        class Cloud {
            constructor() {
                this.x = Math.random() * actualWidth;
                this.y = Math.random() * (actualHeight * 0.3) + 20;
                this.width = 50;
                this.height = 30;
                this.speed = 1;
                this.color = 'rgba(200, 200, 200, 0.3)';
            }
            
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 15, 0, Math.PI * 2);
                ctx.arc(this.x + 20, this.y - 10, 20, 0, Math.PI * 2);
                ctx.arc(this.x + 40, this.y, 15, 0, Math.PI * 2);
                ctx.fill();
            }
            
            update() {
                this.x -= this.speed;
                if (this.x + this.width < 0) {
                    this.x = actualWidth;
                }
            }
        }
        
        let clouds = [new Cloud(), new Cloud(), new Cloud()];
        
        function drawDino() {
            ctx.fillStyle = dino.color;
            
            if (dino.ducking) {
                ctx.fillRect(dino.x, dino.y + 20, 50, 25);
                ctx.fillRect(dino.x + 35, dino.y + 10, 15, 15);
                ctx.fillStyle = 'white';
                ctx.fillRect(dino.x + 43, dino.y + 12, 4, 4);
                ctx.fillStyle = 'black';
                ctx.fillRect(dino.x + 44, dino.y + 13, 2, 2);
            } else {
                ctx.fillStyle = dino.color;
                ctx.fillRect(dino.x, dino.y, 40, 50);
                ctx.fillRect(dino.x + 30, dino.y - 10, 15, 15);
                ctx.fillStyle = 'white';
                ctx.fillRect(dino.x + 38, dino.y - 8, 4, 4);
                ctx.fillStyle = 'black';
                ctx.fillRect(dino.x + 39, dino.y - 7, 2, 2);
                ctx.fillStyle = dino.color;
                ctx.fillRect(dino.x - 10, dino.y + 30, 10, 15);
            }
        }
        
        function jump() {
            if (gameActive && !dino.jumping && !dino.ducking) {
                dino.velocityY = jumpPower;
                dino.jumping = true;
            }
        }
        
        function duck() {
            if (gameActive) {
                dino.ducking = true;
                setTimeout(() => {
                    dino.ducking = false;
                }, 200);
            }
        }
        
        function checkCollision(rect1, rect2) {
            const padding = 5;
            return rect1.x + padding < rect2.x + rect2.width - padding &&
                   rect1.x + rect1.width - padding > rect2.x + padding &&
                   rect1.y + padding < rect2.y + rect2.height - padding &&
                   rect1.y + rect1.height - padding > rect2.y + padding;
        }
        
        function updateGame() {
            if (!gameActive || gamePaused) return;
            
            if (dino.jumping || dino.velocityY > 0) {
                dino.velocityY += gravity;
                dino.y += dino.velocityY;
                
                if (dino.y >= groundY) {
                    dino.y = groundY;
                    dino.jumping = false;
                    dino.velocityY = 0;
                }
            }
            
            clouds.forEach(cloud => cloud.update());
            
            if (Math.random() < 0.015 * speedMultiplier) {
                obstacles.push(new Obstacle());
            }
            
            obstacles.forEach(obstacle => {
                obstacle.update();
                
                if (checkCollision(dino, obstacle)) {
                    endGame();
                }
            });
            
            obstacles = obstacles.filter(obs => !obs.isOffScreen());
            
            score += 1;
            speedMultiplier = 1 + (score / 15000);
            document.getElementById('score').textContent = Math.floor(score / 10);
        }
        
        function drawGame() {
            ctx.fillStyle = '#f0f0f0';
            ctx.fillRect(0, 0, actualWidth, actualHeight);
            
            clouds.forEach(cloud => cloud.draw());
            
            ctx.strokeStyle = '#ccc';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(actualWidth, groundY);
            ctx.stroke();
            
            drawDino();
            obstacles.forEach(obstacle => obstacle.draw());
            
            if (!gameActive) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Click or press SPACE to start', actualWidth / 2, actualHeight / 2);
            }
        }
        
        function gameLoop() {
            updateGame();
            drawGame();
            requestAnimationFrame(gameLoop);
        }
        
        function toggleGame() {
            if (!gameActive) {
                gameActive = true;
                gamePaused = false;
                gameRunning = true;
            } else {
                gamePaused = !gamePaused;
            }
        }
        
        function resetGame() {
            gameActive = false;
            gamePaused = false;
            gameRunning = false;
            score = 0;
            speedMultiplier = 1;
            dino.y = groundY;
            dino.velocityY = 0;
            dino.jumping = false;
            dino.ducking = false;
            obstacles = [];
            document.getElementById('gameOverScreen').style.display = 'none';
            document.getElementById('score').textContent = '0';
            toggleGame();
        }
        
        function endGame() {
            gameActive = false;
            gamePaused = true;
            gameRunning = false;
            
            const finalScore = Math.floor(score / 10);
            document.getElementById('finalScore').textContent = finalScore;
            document.getElementById('gameOverScreen').style.display = 'flex';
            
            if (finalScore > bestScore) {
                bestScore = finalScore;
                localStorage.setItem('dino_bestScore', bestScore);
                document.getElementById('bestScore').textContent = bestScore;
            }
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!gameRunning) {
                    resetGame();
                } else if (gameActive) {
                    jump();
                }
            }
            if (e.code === 'ArrowDown') {
                e.preventDefault();
                if (gameActive) {
                    duck();
                }
            }
        });
        
        canvas.addEventListener('click', () => {
            if (!gameRunning) {
                resetGame();
            } else if (gameActive) {
                jump();
            }
        });
        
        document.getElementById('bestScore').textContent = bestScore;
        gameLoop();
    </script>
</body>
</html>
